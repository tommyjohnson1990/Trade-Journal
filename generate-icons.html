<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Right-click each image below and "Save image as" — save as <b>icon-192.png</b> and <b>icon-512.png</b> in your trading-journal folder.</p>

<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>

<br><br>
<a id="dl192" download="icon-192.png">Download icon-192.png</a><br>
<a id="dl512" download="icon-512.png">Download icon-512.png</a>

<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#161b22';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();

  // Chart line
  const pad = s * 0.15;
  const w = s - pad * 2;
  const h = s - pad * 2;
  const points = [
    [0, 0.65], [0.2, 0.55], [0.35, 0.7], [0.5, 0.35], [0.65, 0.45], [0.8, 0.2], [1, 0.3]
  ];

  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = s * 0.045;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  points.forEach(([x, y], i) => {
    const px = pad + x * w;
    const py = pad + y * h;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  });
  ctx.stroke();

  // Dot at end
  const last = points[points.length - 1];
  ctx.fillStyle = '#58a6ff';
  ctx.beginPath();
  ctx.arc(pad + last[0] * w, pad + last[1] * h, s * 0.055, 0, Math.PI * 2);
  ctx.fill();
}

const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
drawIcon(c192);
drawIcon(c512);

document.getElementById('dl192').href = c192.toDataURL('image/png');
document.getElementById('dl512').href = c512.toDataURL('image/png');
</script>
</body>
</html>
